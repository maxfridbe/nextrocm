# VoxCPM2, its language models in int8 (less VRAM, faster)
# model card (model-cards/README.md): what `nextrocm models search | pull` offers and what the registry entry gets
id: voxcpm2-int8
kind: audio
arch: voxcpm2
license: apache-2.0
commercial: true
title: VoxCPM2, its language models in int8 (less VRAM, faster)
about: 'VoxCPM2: MiniCPM4 base (28 layers) and residual (8) language models, a local encoder and a local flow-matching DiT (12 layers each), AudioVAE V2 (16 kHz in, 48 kHz out) - OpenBMB''s checkpoint'
gpus: '0'
vram_gib: 4.0                   # development-host: 3.325 GB sampled peak, short references and default 60 s allowance; runtime allocation guards remain active
speech:
- design
- clone
- direction
defaults:
  seconds: 60.0
  steps: 10
  cfg: 2.0
env:
  NS_VCP_INT8: '1'
  NEXTROCM_VCP_ROPE_BF16_CACHE: '1'
  NEXTROCM_VCP_F32_ROWS: '1'
  NEXTROCM_VCP_F32_KV: '1'
  NS_VCP_CONV_UP_TILED: '1'
  NS_VCP_LINEAR_F16_TILED: '0'
  NS_VCP_FLOW_F16_TILED: '0'
files:
  model: vcp2-model
  config: vcp2-config
  tokenizer: vcp2-tokenizer
  vae: vcp2-vae
guide: guides/voxcpm2.md
